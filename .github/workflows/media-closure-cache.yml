name: Seed the release dependency caches

# actions/cache entries saved on a tag ref are invisible to later tags, so every
# release rebuilt the media closure (~10 min) and the native LGPL FFmpeg SDK.
# A cache saved from main is visible to every ref. Run this after changing the
# pins, a recipe, its patches or SHA256SUMS.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/pins.env
      - scripts/build_media_closure.sh
      - scripts/media-patches/**
      - third_party/media-source/SHA256SUMS
      - src/playback/mpv/mpv_api.hpp
      - scripts/build_ffmpeg_lgpl.sh
      - scripts/apply_ffmpeg_memory_reservation.py
      - third_party/ffmpeg-patches/**
      - third_party/ffmpeg-source/**
      - .github/actions/macos-setup/action.yml
      - .github/workflows/media-closure-cache.yml

concurrency:
  group: media-closure-cache
  cancel-in-progress: true

jobs:
  seed:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-setup
        with:
          media-closure: "true"
          ffmpeg-lgpl: "true"
