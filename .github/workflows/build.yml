name: Build standalone WAM apps

# The full build is the required check before a squash merge to main. It runs
# once when a pull request opens or leaves draft, and on manual dispatch for
# the branch head; it does not run on every push, and a newer run for the
# same pull request cancels the older one.
on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    # Hosted arm64 only. The product ships for Apple silicon; the pinned LGPL
    # FFmpeg recipe is arm64-only; and the Intel image has no hardware video
    # decoder, no ProRes and no accelerated CGL, so its lane could only skip.
    timeout-minutes: 90
    runs-on: macos-15
    env:
      QT_VERSION: 6.11.1
      WAM_ARCHITECTURE: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true
      - run: brew install cmake ninja pkg-config mpv ffmpeg
      - run: test "$(qmake -query QT_VERSION)" = "$QT_VERSION"
      - name: Install test-proof Python modules
        run: python3 -m pip install --quiet numpy
      - name: Generate deterministic native decoder fixture
        run: |
          mkdir -p build-fixtures
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=320x180:rate=30:duration=3" \
            -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000:duration=3" \
            -map 0:v:0 -map 1:a:0 -frames:v 90 \
            -c:v libx264 -pix_fmt yuv420p \
            -bf 2 -g 30 -x264-params "keyint=30:min-keyint=30:scenecut=0" \
            -c:a aac -b:a 64k -shortest \
            -movflags +faststart \
            build-fixtures/native-bframes-h264.mp4
          test "$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=has_b_frames -of csv=p=0 \
            build-fixtures/native-bframes-h264.mp4)" -gt 0
          test "$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name -of csv=p=0 \
            build-fixtures/native-bframes-h264.mp4)" = "aac"
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=320x180:rate=30:duration=2,format=yuv420p10le" \
            -frames:v 60 -c:v libx265 -profile:v main10 \
            -pix_fmt yuv420p10le -tag:v hvc1 -bf 2 -g 30 \
            -x265-params "keyint=30:min-keyint=30:scenecut=0:log-level=error" \
            -movflags +faststart \
            build-fixtures/native-main10-hevc.mp4
          test "$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=profile -of csv=p=0 \
            build-fixtures/native-main10-hevc.mp4)" = "Main 10"
          test "$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=pix_fmt -of csv=p=0 \
            build-fixtures/native-main10-hevc.mp4)" = "yuv420p10le"
      - name: Restore the native LGPL decoder SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg-lgpl
          key: ffmpeg-lgpl-${{ runner.os }}-${{ runner.arch }}-13.3-${{ hashFiles('scripts/build_ffmpeg_lgpl.sh', 'scripts/apply_ffmpeg_memory_reservation.py', 'third_party/ffmpeg-patches/wam_memory_reservation.inc', 'third_party/ffmpeg-source/ffmpeg-9.0.1.tar.xz') }}
      - name: Build the native LGPL decoder SDK
        run: |
          set -euo pipefail
          if [[ ! -f third_party/ffmpeg-lgpl/lib/libavcodec-wamnative.63.dylib ]]; then
            scripts/build_ffmpeg_lgpl.sh third_party/ffmpeg-source/ffmpeg-9.0.1.tar.xz
          fi
          [[ "$(lipo -archs third_party/ffmpeg-lgpl/lib/libavcodec-wamnative.63.dylib)" == arm64 ]]
      - run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DWAM_ENABLE_MACOS_NATIVE_VIDEO=ON
          -DWAM_ENABLE_AVFORMAT_STAGE=ON
          -DWAM_NATIVE_VIDEO_TEST_FIXTURE=${{ github.workspace }}/build-fixtures/native-bframes-h264.mp4
          -DWAM_NATIVE_VIDEO_10BIT_TEST_FIXTURE=${{ github.workspace }}/build-fixtures/native-main10-hevc.mp4
          -DWAM_REQUIRE_NATIVE_VIDEO_TEST_HARDWARE=ON
      - run: cmake --build build --parallel
      # Benchmarks are EXCLUDE_FROM_ALL targets registered under the benchmark label.
      - run: ctest --test-dir build --output-on-failure -LE benchmark
      - name: Install Qt app bundle
        run: |
          set -o pipefail
          cmake --install build \
            --prefix "${{ github.workspace }}/stage" 2>&1 | tee qt-install.log
          # macdeployqt walks PlugIns/ and complains that the nested Quick Look
          # appex's Info.plist is not an object file. The appex is self-contained
          # by design and the payload verification below proves the closure;
          # every other deployment error still fails the build.
          if grep -E '^(ERROR:|CMake Error)' qt-install.log \
             | grep -v 'WAMThumbnail.appex/Contents/.* is not an object file'; then
            echo "Qt deployment reported errors despite a zero exit code" >&2
            exit 1
          fi
          MACDEPLOYQT="$QT_ROOT_DIR/bin/macdeployqt" scripts/fix_qt_qml_deploy_macos.zsh stage/WAM.app qml
      - name: Add standalone media and caption runtime
        run: |
          chmod +x scripts/*.sh scripts/*.zsh
          scripts/build_whisper.sh build/runtime/whisper-cli
          scripts/fetch_whisper_model.sh build/runtime/models/ggml-base.en.bin
          scripts/bundle_macos.zsh \
            stage/WAM.app \
            build/runtime/whisper-cli \
            build/runtime/models/ggml-base.en.bin
      - name: Verify installed macOS payload
        run: |
          test -x stage/WAM.app/Contents/MacOS/WAM
          test -d stage/WAM.app/Contents/Frameworks/QtCore.framework
          test -d stage/WAM.app/Contents/Frameworks/QtQuick.framework
          test -f stage/WAM.app/Contents/PlugIns/platforms/libqcocoa.dylib
          test -d stage/WAM.app/Contents/Resources/qml/QtQuick
          test -s stage/WAM.app/Contents/Resources/WAM.icns
          test -x stage/WAM.app/Contents/Resources/tools/ffmpeg
          test -x stage/WAM.app/Contents/Resources/tools/whisper-cli
          test -s stage/WAM.app/Contents/Resources/models/ggml-base.en.bin
          test "$(lipo -archs stage/WAM.app/Contents/MacOS/WAM)" = "${{ env.WAM_ARCHITECTURE }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
            stage/WAM.app/Contents/Info.plist)" = "WAM.icns"
          stage/WAM.app/Contents/MacOS/WAM --verify-runtime
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            stage/WAM.app/Contents/Info.plist
          codesign --verify --deep --strict stage/WAM.app
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --verify --strict "$candidate"
            fi
          done < <(find stage/WAM.app/Contents -type f -print0)
      - name: Prepare offline WAMKit signing bundle when configured
        env:
          WAM_MACOS_CODESIGN_IDENTITY: ${{ secrets.WAM_MACOS_CODESIGN_IDENTITY }}
        run: sh scripts/sign_release.sh --if-identity --app stage/WAM.app
      - run: >-
          ditto -c -k --sequesterRsrc --keepParent
          stage/WAM.app WAM-macOS-${{ env.WAM_ARCHITECTURE }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WAM-macOS-${{ env.WAM_ARCHITECTURE }}
          path: WAM-macOS-${{ env.WAM_ARCHITECTURE }}.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: 6.11.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libmpv-dev libgl-dev libegl1 ffmpeg libfuse2t64 libxcb-cursor0 libxkbcommon-x11-0 xvfb
      - run: test "$(qmake -query QT_VERSION)" = "$QT_VERSION"
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: xvfb-run -a ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "${{ github.workspace }}/AppDir/usr"
      - run: chmod +x scripts/*.sh && scripts/build_whisper.sh build/runtime/whisper-cli && scripts/fetch_whisper_model.sh build/runtime/models/ggml-base.en.bin
      - name: Install bundled media and caption tools
        run: |
          install -Dm755 "$(command -v ffmpeg)" AppDir/usr/lib/wam/tools/ffmpeg
          install -Dm755 build/runtime/whisper-cli AppDir/usr/lib/wam/tools/whisper-cli
          install -Dm644 build/runtime/models/ggml-base.en.bin AppDir/usr/share/wam/models/ggml-base.en.bin
      - name: Install AppImage deployment tools
        run: |
          curl --fail --location --retry 3 \
            --output linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
      - name: Build standalone AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPIMAGETOOL_APP_NAME: WAM
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
        run: >-
          ./linuxdeploy.AppImage
          --appdir AppDir
          --executable AppDir/usr/bin/wam
          --executable AppDir/usr/lib/wam/tools/ffmpeg
          --executable AppDir/usr/lib/wam/tools/whisper-cli
          --desktop-file packaging/linux/wam.desktop
          --icon-file packaging/linux/wam.svg
          --plugin qt
          --output appimage
      - name: Verify AppImage payload
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./WAM*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/wam
          test -x squashfs-root/usr/lib/wam/tools/ffmpeg
          test -x squashfs-root/usr/lib/wam/tools/whisper-cli
          test -s squashfs-root/usr/share/wam/models/ggml-base.en.bin
          find squashfs-root -name 'libQt6Core.so.6' -print -quit | grep -q .
          find squashfs-root -name 'libQt6Gui.so.6' -print -quit | grep -q .
          find squashfs-root -name 'libQt6Qml.so.6' -print -quit | grep -q .
          find squashfs-root -name 'libQt6Quick.so.6' -print -quit | grep -q .
          find squashfs-root -name 'libqxcb.so' -print -quit | grep -q .
          find squashfs-root -type d -path '*/qml/QtQuick' -print -quit | grep -q .
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a \
            ./WAM*.AppImage --verify-runtime
          runtime_library_path="$(find squashfs-root/usr -type d \( -name lib -o -path '*/lib/*' \) -print | paste -sd: -)"
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q ELF; then
              unresolved="$(LD_LIBRARY_PATH="$runtime_library_path" ldd "$candidate" 2>/dev/null | grep 'not found' || true)"
              if test -n "$unresolved"; then
                echo "Unresolved dependency in $candidate" >&2
                echo "$unresolved" >&2
                exit 1
              fi
            fi
          done < <(find squashfs-root/usr/bin squashfs-root/usr/lib squashfs-root/usr/plugins squashfs-root/usr/qml -type f 2>/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: WAM-Linux
          path: WAM*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    timeout-minutes: 90
    runs-on: windows-latest
    # Qt comes from MSYS2 like the compiler: Qt's own MinGW build targets the
    # msvcrt runtime and its entry-point library fails to link against UCRT64
    # (undefined __imp___argc), and the installer tool cannot read Qt's
    # 6.11.x Windows index anyway.
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            curl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Select Qt SDK and verify media development package
        run: |
          echo "QT_ROOT_DIR=$(cygpath -w /ucrt64)" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          /ucrt64/bin/qmake6 -query QT_VERSION | grep -E '^6\.1[0-9]\.'
          command -v windeployqt6
          /ucrt64/bin/pkg-config --modversion mpv
          test -f /ucrt64/include/mpv/client.h
      - name: Test Windows QML deploy tool discovery
        run: sh tests/package_windows_qml_scanner_test.sh
      - name: Configure with the pinned Qt SDK
        run: |
          export PATH="/ucrt64/bin:$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          export PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig:/ucrt64/share/pkgconfig
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR")" \
            -DPKG_CONFIG_EXECUTABLE="$(cygpath -m /ucrt64/bin/pkg-config.exe)"
      - run: |
          export PATH="/ucrt64/bin:$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          cmake --build build --parallel
      - run: |
          export PATH="/ucrt64/bin:$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          ctest --test-dir build --output-on-failure
      - run: chmod +x scripts/*.sh && scripts/build_whisper.sh build/runtime/whisper-cli.exe && scripts/fetch_whisper_model.sh build/runtime/models/ggml-base.en.bin
      - run: |
          export PATH="/ucrt64/bin:$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          scripts/package_windows.sh
      - name: Verify Windows payload
        run: |
          test -x package/WAM.exe
          test -f package/Qt6Core.dll
          test -f package/Qt6Gui.dll
          test -f package/Qt6Qml.dll
          test -f package/Qt6Quick.dll
          test -f package/Qt6QuickControls2.dll
          test -f package/platforms/qwindows.dll
          test -f package/qt.conf
          grep -qxF 'QmlImports=qml' package/qt.conf
          test -d package/qml/QtQuick
          test -x package/tools/ffmpeg.exe
          test -x package/tools/whisper-cli.exe
          test -s package/models/ggml-base.en.bin
          pacman -Q > package/MSYS2-PACKAGES.txt
      - name: Create Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath WAM-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: WAM-Windows
          path: WAM-Windows.zip
          if-no-files-found: error
          retention-days: 14
