name: Build standalone WAM apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # Hosted arm64 only. The product ships for Apple silicon; the pinned LGPL
    # FFmpeg recipe is arm64-only; and the Intel image has no hardware video
    # decoder, no ProRes and no accelerated CGL, so its lane could only skip.
    timeout-minutes: 90
    runs-on: macos-15
    env:
      QT_VERSION: 6.11.1
      WAM_ARCHITECTURE: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true
      - run: brew install cmake ninja pkg-config mpv ffmpeg
      - run: test "$(qmake -query QT_VERSION)" = "$QT_VERSION"
      - name: Install test-proof Python modules
        run: python3 -m pip install --quiet numpy
      - name: Generate deterministic native decoder fixture
        run: |
          mkdir -p build-fixtures
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=320x180:rate=30:duration=3" \
            -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=48000:duration=3" \
            -map 0:v:0 -map 1:a:0 -frames:v 90 \
            -c:v libx264 -pix_fmt yuv420p \
            -bf 2 -g 30 -x264-params "keyint=30:min-keyint=30:scenecut=0" \
            -c:a aac -b:a 64k -shortest \
            -movflags +faststart \
            build-fixtures/native-bframes-h264.mp4
          test "$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=has_b_frames -of csv=p=0 \
            build-fixtures/native-bframes-h264.mp4)" -gt 0
          test "$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name -of csv=p=0 \
            build-fixtures/native-bframes-h264.mp4)" = "aac"
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=320x180:rate=30:duration=2,format=yuv420p10le" \
            -frames:v 60 -c:v libx265 -profile:v main10 \
            -pix_fmt yuv420p10le -tag:v hvc1 -bf 2 -g 30 \
            -x265-params "keyint=30:min-keyint=30:scenecut=0:log-level=error" \
            -movflags +faststart \
            build-fixtures/native-main10-hevc.mp4
          test "$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=profile -of csv=p=0 \
            build-fixtures/native-main10-hevc.mp4)" = "Main 10"
          test "$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=pix_fmt -of csv=p=0 \
            build-fixtures/native-main10-hevc.mp4)" = "yuv420p10le"
      - name: Restore the native LGPL decoder SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg-lgpl
          key: ffmpeg-lgpl-${{ runner.os }}-${{ runner.arch }}-13.3-${{ hashFiles('scripts/build_ffmpeg_lgpl.sh', 'scripts/apply_ffmpeg_memory_reservation.py', 'third_party/ffmpeg-patches/wam_memory_reservation.inc', 'third_party/ffmpeg-source/ffmpeg-9.0.1.tar.xz') }}
      - name: Build the native LGPL decoder SDK
        run: |
          set -euo pipefail
          if [[ ! -f third_party/ffmpeg-lgpl/lib/libavcodec-wamnative.63.dylib ]]; then
            scripts/build_ffmpeg_lgpl.sh third_party/ffmpeg-source/ffmpeg-9.0.1.tar.xz
          fi
          [[ "$(lipo -archs third_party/ffmpeg-lgpl/lib/libavcodec-wamnative.63.dylib)" == arm64 ]]
      - run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DWAM_ENABLE_MACOS_NATIVE_VIDEO=ON
          -DWAM_ENABLE_AVFORMAT_STAGE=ON
          -DWAM_NATIVE_VIDEO_TEST_FIXTURE=${{ github.workspace }}/build-fixtures/native-bframes-h264.mp4
          -DWAM_NATIVE_VIDEO_10BIT_TEST_FIXTURE=${{ github.workspace }}/build-fixtures/native-main10-hevc.mp4
          -DWAM_REQUIRE_NATIVE_VIDEO_TEST_HARDWARE=ON
      - run: cmake --build build --parallel
      # Benchmarks are EXCLUDE_FROM_ALL targets registered under the benchmark label.
      - run: ctest --test-dir build --output-on-failure -LE benchmark
      - name: Install Qt app bundle
        run: |
          set -o pipefail
          cmake --install build \
            --prefix "${{ github.workspace }}/stage" 2>&1 | tee qt-install.log
          # macdeployqt walks PlugIns/ and complains that the nested Quick Look
          # appex's Info.plist is not an object file. The appex is self-contained
          # by design and the payload verification below proves the closure;
          # every other deployment error still fails the build.
          if grep -E '^(ERROR:|CMake Error)' qt-install.log \
             | grep -v 'WAMThumbnail.appex/Contents/.* is not an object file'; then
            echo "Qt deployment reported errors despite a zero exit code" >&2
            exit 1
          fi
          scripts/fix_qt_qml_deploy_macos.zsh stage/WAM.app qml
      - name: Add standalone media and caption runtime
        run: |
          chmod +x scripts/*.sh scripts/*.zsh
          scripts/build_whisper.sh build/runtime/whisper-cli
          scripts/fetch_whisper_model.sh build/runtime/models/ggml-base.en.bin
          scripts/bundle_macos.zsh \
            stage/WAM.app \
            build/runtime/whisper-cli \
            build/runtime/models/ggml-base.en.bin
      - name: Verify installed macOS payload
        run: |
          test -x stage/WAM.app/Contents/MacOS/WAM
          test -d stage/WAM.app/Contents/Frameworks/QtCore.framework
          test -d stage/WAM.app/Contents/Frameworks/QtQuick.framework
          test -f stage/WAM.app/Contents/PlugIns/platforms/libqcocoa.dylib
          test -d stage/WAM.app/Contents/Resources/qml/QtQuick
          test -s stage/WAM.app/Contents/Resources/WAM.icns
          test -x stage/WAM.app/Contents/Resources/tools/ffmpeg
          test -x stage/WAM.app/Contents/Resources/tools/whisper-cli
          test -s stage/WAM.app/Contents/Resources/models/ggml-base.en.bin
          test "$(lipo -archs stage/WAM.app/Contents/MacOS/WAM)" = "${{ env.WAM_ARCHITECTURE }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
            stage/WAM.app/Contents/Info.plist)" = "WAM.icns"
          stage/WAM.app/Contents/MacOS/WAM --verify-runtime
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            stage/WAM.app/Contents/Info.plist
          codesign --verify --deep --strict stage/WAM.app
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              codesign --verify --strict "$candidate"
            fi
          done < <(find stage/WAM.app/Contents -type f -print0)
      - name: Prepare offline WAMKit signing bundle when configured
        env:
          WAM_MACOS_CODESIGN_IDENTITY: ${{ secrets.WAM_MACOS_CODESIGN_IDENTITY }}
        run: sh scripts/sign_release.sh --if-identity --app stage/WAM.app
      - run: >-
          ditto -c -k --sequesterRsrc --keepParent
          stage/WAM.app WAM-macOS-${{ env.WAM_ARCHITECTURE }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WAM-macOS-${{ env.WAM_ARCHITECTURE }}
          path: WAM-macOS-${{ env.WAM_ARCHITECTURE }}.zip
          if-no-files-found: error
          retention-days: 14
